# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Build the pkgdown site and deploy it with GitHub Pages Actions.
#
# On pull_request the site is BUILT but not deployed, so reference/article
# index gaps in _pkgdown.yml fail the PR check without touching the Pages
# deployment environment.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: pkgdown.yaml

permissions:
  contents: read
  pages: write
  id-token: write

# Only restrict concurrency for non-PR jobs
concurrency:
  group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown renders every top-level Markdown file it finds, including
      # repository-only contributor and architecture notes. The CI checkout is
      # disposable, so stage those notes outside the package tree before the
      # build rather than renaming or deleting their canonical source files.
      - name: Stage repository-only Markdown outside the site source
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/choicer-internal-markdown"
          for file in AGENTS.md CLAUDE.md ARCHITECTURE.md; do
            if [[ -f "${file}" ]]; then
              mv "${file}" "${RUNNER_TEMP}/choicer-internal-markdown/"
            fi
          done

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: pkgdown
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
